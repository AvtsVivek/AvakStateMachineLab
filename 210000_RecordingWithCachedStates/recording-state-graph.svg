<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title description">
  <title id="title">Flat recorder: state permissions and a transition guard</title>
  <desc id="description">Idle Start to Recording has a Start-only guard. Recording CanExit applies to both Pause to Paused and Stop to Idle. Paused CanEnter applies when entering Paused. Resume returns to Recording without the Start guard; Paused Stop returns to Idle.</desc>
  <defs>
	<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
	  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155" />
	</marker>
  </defs>
  <rect width="1000" height="580" fill="#f8fafc" />
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#0f172a">
	<text x="500" y="38" font-size="25" font-weight="bold">State-wide permissions and a transition-specific guard</text>
	<text x="500" y="68" font-size="17">Three flat states; no hierarchy</text>
	<g stroke="#334155" stroke-width="2">
	  <rect x="40" y="190" width="240" height="120" rx="16" fill="#dbeafe" />
	  <rect x="380" y="190" width="240" height="120" rx="16" fill="#dcfce7" />
	  <rect x="720" y="190" width="240" height="120" rx="16" fill="#fef3c7" />
	</g>
	<text x="160" y="224" font-size="23" font-weight="bold">Idle</text>
	<text x="160" y="257" font-size="16">CanEnter: true</text>
	<text x="160" y="285" font-size="16">CanExit: true</text>
	<text x="500" y="224" font-size="23" font-weight="bold">Recording</text>
	<text x="500" y="257" font-size="16">CanEnter: true</text>
	<text x="500" y="285" font-size="16">CanExit: canLeaveRecording</text>
	<text x="840" y="224" font-size="23" font-weight="bold">Paused</text>
	<text x="840" y="257" font-size="16">CanEnter: canEnterPaused</text>
	<text x="840" y="285" font-size="16">CanExit: true</text>
	<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
	  <path id="start-transition" d="M 280 220 H 380" />
	  <path id="pause-transition" d="M 620 220 H 720" />
	  <path id="resume-transition" d="M 720 280 H 620" />
	  <path id="recording-stop-transition" d="M 380 280 H 280" />
	  <path id="paused-stop-transition" d="M 840 310 C 840 480, 160 480, 160 310" />
	</g>
	<text x="330" y="148" font-size="18">Start</text>
	<text x="330" y="173" font-size="15">[Start guard]</text>
	<text x="670" y="173" font-size="18">Pause</text>
	<text x="670" y="343" font-size="18">Resume</text>
	<text x="330" y="343" font-size="18">Stop</text>
	<text x="500" y="468" font-size="18">Stop (from Paused)</text>
	<text x="500" y="522" font-size="17">Defined transition: guard, then source CanExit, then target CanEnter</text>
	<text x="500" y="550" font-size="17">Only after all checks pass: source Exit, replace state, target Enter</text>
  </g>
</svg>
