<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title description">
  <title id="title">Recording state graph</title>
  <desc id="description">A recorder starts idle. Start moves it to recording, pause moves to paused, resume returns to recording, and stop returns to idle. Invalid requests are rejected and leave the recorder in its current state, shown as self-loops.</desc>
  <defs>
	<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
	  <path d="M 0 0 L 10 4 L 0 8 z" fill="#334155" />
	</marker>
	<style>
	  text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
	  .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
	  .rejected { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
	  .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
	  .state-name { font-size: 20px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
	  .label { font-size: 16px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
	  .rejected-label { font-size: 14px; fill: #92400e; text-anchor: middle; }
	  .initial-label { font-size: 14px; text-anchor: middle; }
	</style>
  </defs>

  <text class="initial-label" x="32" y="239">Initial</text>
  <path class="edge" d="M 38 255 L 63 255" />

  <path class="edge" d="M 190 230 L 383 171" />
  <text class="label" x="286" y="190">Start</text>

  <path class="edge" d="M 517 171 L 708 229" />
  <text class="label" x="613" y="190">Pause</text>

  <path class="edge" d="M 710 270 L 512 189" />
  <text class="label" x="615" y="246">Resume</text>

  <path class="edge" d="M 405 213 C 351 319 235 326 180 300" />
  <text class="label" x="290" y="308">Stop</text>

  <path class="rejected" d="M 85 200 C 45 110 215 110 175 200" />
  <text class="rejected-label" x="130" y="105">Rejected: Pause, Resume, Stop</text>

  <path class="rejected" d="M 405 90 C 370 5 540 5 505 90" />
  <text class="rejected-label" x="455" y="20">Rejected: Start, Resume</text>

  <path class="rejected" d="M 725 200 C 685 110 855 110 815 200" />
  <text class="rejected-label" x="770" y="105">Rejected: Start, Pause</text>

  <circle class="state" cx="130" cy="255" r="66" />
  <text class="state-name" x="130" y="255">Idle</text>

  <circle class="state" cx="455" cy="155" r="70" />
  <text class="state-name" x="455" y="155">Recording</text>

  <circle class="state" cx="770" cy="255" r="66" />
  <text class="state-name" x="770" y="255">Paused</text>

  <text x="450" y="435" font-size="14" text-anchor="middle" fill="#475569">Solid arrows: accepted transitions · Dashed loops: rejected requests leave the state unchanged</text>
</svg>
